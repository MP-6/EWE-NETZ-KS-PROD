<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesys CTI (SAP Live Interaction Widget)</title>
<style>
  :root {
    --phone-h: 150px;
    --bg: #eef1f5; --bar: #ffffff; --card: #ffffff;
    --text: #1d2d3e; --muted: #6a7a8c; --line: #dde3ea;
    --accent: #005f96; --ok: #1b9e77; --warn: #f59a32;
  }
  body[data-theme="dark"] {
    --bg: #0f1b27; --bar: #152332; --card: #1a2b3c;
    --text: #e8eef5; --muted: #93a5b8; --line: #2a3e53;
    --accent: #4aa3df; --ok: #3cc79a; --warn: #f7b055;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "72", "Segoe UI", system-ui, -apple-system, Arial, sans-serif; font-size: 13px; background: var(--bg); color: var(--text); }
  .app { display: flex; flex-direction: column; height: 100%; }

  /* ---- Kopfleiste ---- */
  .bar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px;
         padding: 8px 12px; background: var(--bar); border-bottom: 1px solid var(--line); }
  .state { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #9aa7b4; flex: none; --pulse: 27,158,119; }
  .dot.ready, .dot.p-green { background: var(--ok); }
  .dot.p-orange { background: var(--warn); }
  .dot.p-red { background: #d9534f; }
  .dot.p-grey { background: #9aa7b4; }
  .dot.ringing { background: var(--warn); --pulse: 245,154,50; animation: pulse 1s infinite; }
  .dot.active { background: var(--ok); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(var(--pulse), .55); }
    70% { box-shadow: 0 0 0 9px rgba(var(--pulse), 0); }
    100% { box-shadow: 0 0 0 0 rgba(var(--pulse), 0); }
  }
  .stext { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
  .stext strong { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status-wrap { min-width: 170px; }
  #statusSelect { appearance: none; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 14px; font-weight: 600; padding: 1px 22px 1px 0; cursor: pointer; max-width: 240px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 10px) 55%, calc(100% - 6px) 55%; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; }
  #statusSelect:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  #statusSelect option { color: #1d2d3e; background: #fff; }
  .stext span { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { display: flex; align-items: center; gap: 6px; flex: none; }
  .tools button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card);
                  color: var(--text); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; transition: border-color .15s, background .15s; }
  .tools button:hover { border-color: var(--accent); }
  .tools button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tools svg { width: 14px; height: 14px; fill: currentColor; }
  .zl { min-width: 38px; text-align: center; font-size: 11px; color: var(--muted); }
  .call-actions { display: none; align-items: center; gap: 6px; }
  .call-actions.visible { display: flex; }
  .call-actions button { border: 0; border-radius: 8px; padding: 6px 10px; color: #fff; font-weight: 600; cursor: pointer; }
  .call-actions .answer { background: var(--ok); }
  .call-actions .hangup { background: #c0392b; }

  /* ---- Telefon-Streifen ---- */
  .phone { flex: 0 0 auto; height: var(--phone-h); margin: 8px 8px 0; border-radius: 10px; overflow: hidden;
           background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.18); transition: height .25s ease, margin .25s ease; }
  .phone.collapsed { height: 0; margin: 0 8px; box-shadow: none; }
  .phone { display: none !important; }
  .phone iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* ---- Script & Copilot ---- */
  .inter { position: relative; flex: 1 1 auto; min-height: 0; margin: 8px; border-radius: 10px; overflow: hidden;
           background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .scalebox { width: 100%; height: 100%; transform-origin: 0 0; }
  .scalebox iframe { width: 100%; height: 100%; border: 0; display: block; }
  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 8px; text-align: center; padding: 24px; background: var(--card); color: var(--muted);
           pointer-events: none; transition: opacity .25s, visibility .25s; }
  .empty.hidden { opacity: 0; visibility: hidden; }
  .empty svg { width: 56px; height: 56px; fill: var(--accent); opacity: .85; }
  .empty h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--text); }
  .empty p { margin: 0; max-width: 320px; line-height: 1.45; }

  /* ---- Debug-Leiste (nur mit ?debug=1) ---- */
  .debugbar { display: none; margin: 8px 8px 0; padding: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  body.debug .debugbar { display: block; }
  .row { display: flex; gap: 6px; margin: 4px 0; }
  .row input, .row select { flex: 1; min-width: 0; padding: 4px; }
  .row button { padding: 4px 8px; cursor: pointer; border: 0; border-radius: 4px; background: var(--accent); color: #fff; }
  .row button.ok { background: #00A888; }
  .row button.danger { background: #c0392b; }
  .row button.sap { background: #555; }
  .info { font-size: 12px; color: var(--muted); }
  .log { height: 110px; overflow: auto; background: var(--bg); border: 1px solid var(--line); padding: 4px; font-family: monospace; font-size: 11px; white-space: pre-wrap; }

  /* ---- Script-Spalte abschneiden: iFrame nach links verschieben und um denselben Betrag verbreitern ---- */
  .row .lbl { white-space: nowrap; font-size: 12px; color: var(--muted); align-self: center; }

  /* ---- Feste Breite: Inhalt bleibt auch in einem breit aufgezogenen SAP-Fenster so schmal wie eingestellt ---- */
  .app { max-width: var(--app-w, none); }
  .state { flex: 1 1 0; min-width: 0; }
  .call-actions { flex: none; }
  #statusSelect { max-width: 100%; }
</style>
</head>
<body>

<!-- Provider URL fuer das SAP Live Interaction Widget.
     Optionen: ?debug=1 | ?phoneHeight=300 | ?theme=dark|light|auto | ?phone=collapsed | ?sap=<format> -->
<div class="app">

  <header class="bar">
    <div class="state">
      <span class="dot" id="dot"></span>
      <div class="stext status-wrap">
        <select id="statusSelect" aria-label="Genesys-Status ändern" title="Genesys-Status ändern">
          <option value="">Nicht verbunden</option>
        </select>
        <span id="stSub"></span>
      </div>
    </div>
    <div class="call-actions" id="callActions">
      <button type="button" class="answer" id="btnHeaderAnswer">Annehmen</button>
      <button type="button" class="hangup" id="btnHeaderHangup">Auflegen</button>
    </div>

  </header>

  <section class="phone" id="phone">
    <iframe id="genesysFrame"
            allow="camera *; microphone *; geolocation *; clipboard-write *; autoplay *; hid *"
            title="Genesys Cloud Embeddable Framework"></iframe>
  </section>

  <div class="debugbar">
    <div class="info" id="ctiInfo">Framework: nicht verbunden | Interaktion: -</div>
    <div class="row">
      <button class="ok" id="btnAnswer">Annehmen</button>
      <button class="danger" id="btnHangup">Auflegen</button>
      <button id="btnHold">Halten</button>
      <button id="btnMute">Stumm</button>
    </div>
    <div class="row">
      <span class="lbl">Copilot-Breite</span>
      <input type="range" id="cwRange" min="200" max="600" step="5">
      <span class="lbl" id="cwVal"></span>
    </div>
    <div class="row">
      <select id="sapFormat" title="Nachrichtenformat an SAP">
        <option value="flat-string">flach / JSON-Text</option>
        <option value="flat-object">flach / Objekt</option>
        <option value="wrap-string">payload-Schluessel / JSON-Text</option>
        <option value="wrap-object">payload-Schluessel / Objekt</option>
        <option value="xml">XML (ohne Kopfzeile)</option>
        <option value="xml-decl">XML (mit xml-Kopfzeile)</option>
      </select>
    </div>
    <div class="row">
      <input id="sapTestAni" value="+4915112345678" title="Test-Rufnummer fuer die SAP-Tests">
      <button class="sap" id="btnSapNotify">SAP: Notify</button>
      <button class="sap" id="btnSapAccept">SAP: Accept</button>
      <button class="sap" id="btnSapEnd">SAP: End</button>
    </div>
    <div class="log" id="ctiLog"></div>
  </div>

  <main class="inter">
    <div class="scalebox" id="scalebox">
      <iframe id="genesysInteractionFrame"
              allow="camera *; microphone *; geolocation *; clipboard-write *; autoplay *; hid *"
              title="Genesys Cloud Agent Copilot"></iframe>
    </div>
    <div class="empty" id="empty">
      <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
      <h2 id="emptyTitle">Verbinde mit Genesys &hellip;</h2>
      <p id="emptyText">Bitte oben im Telefonfenster anmelden.</p>
    </div>
  </main>

</div>

<script>
(function () {
  'use strict';

  // ====== Konfiguration ======
  var GENESYS_ORIGIN = 'https://apps.mypurecloud.de';
  var FRAME_SRC = GENESYS_ORIGIN + '/crm/embeddableFramework.html?enableFrameworkClientId=true&dedicatedLoginWindow=true';
  var INTERACTION_SRC = GENESYS_ORIGIN + '/crm/interaction.html';
  var DEFAULT_COUNTRY_CODE = '+49';   // fuer Nummern ohne + (z. B. 0173... -> +49173...)
  var SAP_ENABLED = true;             // Events an SAP senden (Notify/Accept/End)
  // Organisationsspezifische Genesys Presence-Definition-IDs als URL-Parameter:
  // ?status_ON_QUEUE=<id>&status_AVAILABLE=<id>&status_BREAK=<id> usw.
  var STATUS_LABELS = {
    ON_QUEUE: 'In Warteschlange', AVAILABLE: 'Verfügbar', AWAY: 'Abwesend',
    BREAK: 'Pause', MEAL: 'Essenspause', BUSY: 'Beschäftigt',
    MEETING: 'Besprechung', TRAINING: 'Schulung',
    PERFORMANCE_TRAINING: 'Performance-Schulung', FACHANSPRECHPARTNER: 'Fachansprechpartner',
    SCHRIFTBEARBEITUNG: 'Schriftbearbeitung', BASIC_TRAINING: 'Basis-Schulung',
    UPDATE_TRAINING: 'Update-Schulung', COACHING_FEEDBACK: 'Coaching & Feedback'
  };
  var STATUS_IDS = {
    ON_QUEUE: 'e08eaf1b-ee47-4fa9-a231-1200e284798f',
    AVAILABLE: '6a3af858-942f-489d-9700-5f9bcdcdae9b',
    AWAY: '5e5c5c66-ea97-4e7f-ac41-6424784829f2',
    BREAK: '227b37e2-f1d0-4dd0-8f50-badd7cf6d158',
    MEAL: '3fd96123-badb-4f69-bc03-1b1ccc6d8014',
    BUSY: '31fe3bac-dea6-44b7-bed7-47f91660a1a0',
    MEETING: 'bbdff279-7ae1-48ea-bade-7831d7234c64',
    TRAINING: 'd2390a99-8546-bad9-8f0a-219548e8aeb0',
    PERFORMANCE_TRAINING: '0e2f5027-7514-4d58-8f91-8c5868ce684d',
    FACHANSPRECHPARTNER: '3e93b26b-9b3a-4eb5-9792-5f4ed58ee430',
    SCHRIFTBEARBEITUNG: '6072b39b-d919-47d4-91d1-9343e7e4cad4',
    BASIC_TRAINING: '6fb8f7bd-ff45-4a31-bd52-6e93d9c238bd',
    UPDATE_TRAINING: 'cd8e2860-4d39-4d29-8bf6-d791131b1992',
    COACHING_FEEDBACK: 'e95a8ddd-713c-4607-a177-adc3933f3c97'
  };
  var CTI_VERSION = '06.11.2026 · v10.3 Summary-Bridge';
  // SAP-Nachrichtenformat per URL-Parameter: ?sap=flat-string | flat-object | wrap-string | wrap-object | xml | xml-decl
  // (Standard: wrap-object - von SAP akzeptiert)
  // ===========================

  var params = new URLSearchParams(location.search);
  var DEBUG = params.get('debug') === '1';
  var sapFormat = params.get('sap') || 'wrap-object';
  var theme = params.get('theme') || 'auto';
  if (theme === 'auto') theme = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.body.setAttribute('data-theme', theme);
  // Hoehe des Telefon-Streifens je Zustand (px); per URL ueberschreibbar: ?hIdle=150&hCall=270&hAcw=330
  var HEIGHTS = {
    idle: parseInt(params.get('hIdle'), 10) || 150,
    call: parseInt(params.get('hCall'), 10) || parseInt(params.get('phoneHeight'), 10) || 270,
    acw:  parseInt(params.get('hAcw'), 10) || 330
  };
  if (DEBUG) document.body.classList.add('debug');

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  var frame = document.getElementById('genesysFrame');
  var interactionFrame = document.getElementById('genesysInteractionFrame');
  var phoneEl = document.getElementById('phone');
  var scalebox = document.getElementById('scalebox');
  var infoEl = document.getElementById('ctiInfo');
  var logEl = document.getElementById('ctiLog');
  var inIframe = window.parent !== window;
  var state = { ready: false, interactionId: null };
  var calls = {};   // Zustand je Interaktion: {notified, accepted, ended, dialing}
  var pendingSummaryConversationId = null;
  var summaryPollAttempt = 0;

  function requestSummary(conversationId) {
    if (!conversationId) return;
    pendingSummaryConversationId = conversationId;
    summaryPollAttempt = 0;
    requestSummaryAttempt();
  }

  function requestSummaryAttempt() {
    if (!pendingSummaryConversationId) return;
    summaryPollAttempt += 1;
    log('Summary-Bridge: Abruf Versuch ' + summaryPollAttempt + ' fuer ' + pendingSummaryConversationId);
    send('getSummary', { conversationId: pendingSummaryConversationId });
  }

  function extractSummaryText(data) {
  var items = (data && Array.isArray(data.sessionSummaries)) ? data.sessionSummaries.slice() : [];
  if (!items.length) return '';

  items = items.filter(function (x) {
    return x && String(x.status || '').toLowerCase() === 'completed' &&
      (!x.mediaType || String(x.mediaType).toLowerCase() === 'call');
  });
  if (!items.length) return '';

  items.sort(function (a, b) {
    return new Date(b.dateCreated || 0).getTime() - new Date(a.dateCreated || 0).getTime();
  });

  var x = items[0];
  var edited = x.editedSummary;
  var editedText = '';
  if (typeof edited === 'string') editedText = edited;
  else if (edited && typeof edited === 'object') editedText = edited.text || edited.content || '';

  return String(editedText || x.text || '').trim();
}

  function log(text) {
    if (!DEBUG) return;
    logEl.textContent += '[' + new Date().toLocaleTimeString() + '] ' + text + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }
  function updateInfo() {
    infoEl.textContent = 'Framework: ' + (state.ready ? 'verbunden' : 'nicht verbunden') +
      ' | Interaktion: ' + (state.interactionId || '-');
  }

  // ---------- Oberflaeche: Status, Platzhalter, Zoom, Telefon ein/aus ----------
  var ui = { mode: 'idle', number: '', t0: 0, t1: 0, tick: null, presence: '', routing: '' };
  var PRESENCE = {
    AVAILABLE: ['Verf\u00fcgbar', 'p-green'], ON_QUEUE: ['In Warteschlange', 'p-green'],
    AWAY: ['Abwesend', 'p-orange'], BREAK: ['Pause', 'p-orange'], MEAL: ['Essenspause', 'p-orange'],
    BUSY: ['Besch\u00e4ftigt', 'p-red'], MEETING: ['Besprechung', 'p-red'], TRAINING: ['Schulung', 'p-red'],
    OFFLINE: ['Offline', 'p-grey']
  };
  var ROUTING = {
    OFF_QUEUE: 'Nicht in Warteschlange', IDLE: 'Bereit f\u00fcr Anrufe', INTERACTING: 'Im Gespr\u00e4ch',
    COMMUNICATING: 'Im Gespr\u00e4ch', NOT_RESPONDING: 'Nicht erreichbar'
  };

  function mmss(ms) {
    var s = Math.max(0, Math.floor(ms / 1000)), m = Math.floor(s / 60); s = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function statusId(key) { return params.get('status_' + key) || STATUS_IDS[key] || ''; }
  function buildStatusOptions(currentKey, currentLabel) {
    var sel = document.getElementById('statusSelect');
    sel.innerHTML = '';

    function addOption(parent, key) {
      var opt = document.createElement('option');
      opt.value = key;
      opt.textContent = key === currentKey && currentLabel ? currentLabel : (STATUS_LABELS[key] || key);
      opt.disabled = key !== currentKey && !statusId(key);
      parent.appendChild(opt);
    }
    function addGroup(label, keys) {
      var group = document.createElement('optgroup');
      group.label = label;
      keys.forEach(function (key) { addOption(group, key); });
      sel.appendChild(group);
    }

    // Systemstatus in der gewohnten Reihenfolge.
    addOption(sel, 'AVAILABLE');
    addGroup('Beschäftigt', ['BUSY', 'COACHING_FEEDBACK', 'SCHRIFTBEARBEITUNG', 'FACHANSPRECHPARTNER']);
    addOption(sel, 'AWAY');
    addOption(sel, 'BREAK');
    addOption(sel, 'MEAL');
    addOption(sel, 'MEETING');
    addGroup('Schulung', ['TRAINING', 'BASIC_TRAINING', 'PERFORMANCE_TRAINING', 'UPDATE_TRAINING']);
    addOption(sel, 'ON_QUEUE');

    // Falls Genesys einen hier nicht abgebildeten Status meldet, bleibt er trotzdem sichtbar.
    var known = ['AVAILABLE','BUSY','COACHING_FEEDBACK','SCHRIFTBEARBEITUNG','FACHANSPRECHPARTNER','AWAY','BREAK','MEAL','MEETING','TRAINING','BASIC_TRAINING','PERFORMANCE_TRAINING','UPDATE_TRAINING','ON_QUEUE'];
    if (currentKey && known.indexOf(currentKey) < 0) addOption(sel, currentKey);
  }
  document.getElementById('statusSelect').addEventListener('change', function () {
    var key = this.value;
    var id = statusId(key);
    if (!id) { this.value = ui.presence || ''; return; }
    log('-> Statuswechsel angefordert: ' + key + ' / ' + id);
    send('updateStatus', { id: id });
    // Auswahl erst wieder dauerhaft umstellen, wenn Genesys den neuen Status zurueckmeldet.
    setTimeout(function () { if (ui.presence !== key) { sel.value = ui.presence || ''; log('Statuswechsel noch nicht von Genesys bestaetigt'); } }, 1500);
  });
  function renderState() {
    var cls = 'dot', title, sub = '';
    var num = ui.number ? ui.number + ' \u00b7 ' : '';
    if (!state.ready) { title = 'Nicht verbunden'; sub = 'Bitte im Telefonfenster anmelden'; }
    else if (ui.mode === 'ringing') { cls += ' ringing'; title = 'Eingehender Anruf'; sub = ui.number; }
    else if (ui.mode === 'dialing') { cls += ' ringing'; title = 'Ausgehender Anruf'; sub = ui.number; }
    else if (ui.mode === 'active') { cls += ' active'; title = 'Im Gespr\u00e4ch'; sub = num + mmss(Date.now() - ui.t0); }
    else if (ui.mode === 'acw') { cls += ' ringing'; title = 'Nachbearbeitung'; sub = num + mmss(Date.now() - ui.t1) + ' \u00b7 Code w\u00e4hlen'; }
    else {
      var pr = PRESENCE[ui.presence];
      cls += ' ' + (pr ? pr[1] : 'ready');
      title = pr ? pr[0] : (ui.presence ? ui.presence.charAt(0) + ui.presence.slice(1).toLowerCase() : 'Verbunden');
      sub = ROUTING[ui.routing] || '';
    }
    document.getElementById('dot').className = cls;
    var statusSelect = document.getElementById('statusSelect');
    var currentKey = ui.presence || '';
    var currentLabel = title;
    var found = false;
    for (var oi = 0; oi < statusSelect.options.length; oi++) {
      if (statusSelect.options[oi].value === currentKey) { found = true; break; }
    }
    if (!found || statusSelect.options.length === 1) buildStatusOptions(currentKey, currentLabel);
    statusSelect.value = currentKey;
    document.getElementById('stSub').textContent = sub;
    var actions = document.getElementById('callActions');
    var answer = document.getElementById('btnHeaderAnswer');
    var hangup = document.getElementById('btnHeaderHangup');
    var showAnswer = ui.mode === 'ringing';
    var showHangup = ui.mode === 'active' || ui.mode === 'dialing';
    answer.style.display = showAnswer ? '' : 'none';
    hangup.style.display = showHangup ? '' : 'none';
    actions.classList.toggle('visible', showAnswer || showHangup);
  }

  function updateEmpty() {
    var empty = document.getElementById('empty');
    var show = !state.interactionId;
    empty.classList.toggle('hidden', !show);
    if (!show) return;
    if (!state.ready) {
      document.getElementById('emptyTitle').textContent = 'Verbinde mit Genesys \u2026';
      document.getElementById('emptyText').textContent = 'Bitte oben im Telefonfenster anmelden.';
    } else {
      document.getElementById('emptyTitle').textContent = 'Warte auf Anruf';
      document.getElementById('emptyText').textContent = 'Agent Copilot wird beim eingehenden Anruf sofort mit vollst\u00e4ndigem Genesys-Kontext geladen.';
    }
  }

  function expandPhone() { phoneEl.classList.remove('collapsed'); }

  function applyPhoneHeight() {
    var key = (ui.mode === 'acw') ? 'acw' : (ui.mode === 'idle' ? 'idle' : 'call');
    document.documentElement.style.setProperty('--phone-h', HEIGHTS[key] + 'px');
  }

  function setMode(mode, number) {
    ui.mode = mode;
    if (number !== undefined) ui.number = number || '';
    clearInterval(ui.tick);
    if (mode === 'active') { ui.t0 = Date.now(); ui.tick = setInterval(renderState, 1000); }
    if (mode === 'acw') { ui.t1 = Date.now(); ui.tick = setInterval(renderState, 1000); }
    // Altes Genesys-CTI bei Anruf/Nachbearbeitung nicht automatisch aufklappen.
    if (mode !== 'idle') phoneEl.classList.add('collapsed');
    applyPhoneHeight();
    renderState();
    updateEmpty();
  }

  // Das Genesys-Framework bleibt technisch geladen, aber visuell dauerhaft ausgeblendet.
  phoneEl.classList.add('collapsed');
  // ---------- Genesys: Befehle senden ----------
  function send(type, data) {
    if (!frame.contentWindow) return;
    frame.contentWindow.postMessage(JSON.stringify({ type: type, data: data === undefined ? {} : data }), GENESYS_ORIGIN);
    log('-> ' + type + (data ? ' ' + JSON.stringify(data) : ''));
  }

  // ---------- SAP: Events senden ----------
  function xmlOf(p) {
    var x = '<payload>';
    Object.keys(p).forEach(function (k) {
      x += '<' + k + '>' + String(p[k]).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</' + k + '>';
    });
    return x + '</payload>';
  }

  function toSap(payload) {
    if (!SAP_ENABLED || !inIframe) { log('(SAP aus oder Seite nicht in SAP) ' + JSON.stringify(payload)); return; }
    var out;
    if (sapFormat === 'xml' || sapFormat === 'xml-decl') {
      out = (sapFormat === 'xml-decl' ? '<?xml version="1.0" encoding="utf-8"?>' : '') + xmlOf(payload);
    } else {
      out = sapFormat.indexOf('wrap') === 0 ? { payload: payload } : payload;
      if (/string$/.test(sapFormat)) out = JSON.stringify(out);
    }
    window.parent.postMessage(out, '*');
    log('-> SAP [' + sapFormat + '] ' + (typeof out === 'string' ? out : JSON.stringify(out)));
  }

  function normalizeNumber(raw) {
    if (!raw) return '';
    var n = String(raw).replace(/^tel:/i, '').replace(/[\s()\-\/]/g, '');
    if (n.charAt(0) === '+') return n;
    if (n.indexOf('00') === 0) return '+' + n.slice(2);
    if (n.charAt(0) === '0') return DEFAULT_COUNTRY_CODE + n.slice(1);
    return /^\d+$/.test(n) ? '+' + n : n;
  }

  function directionOf(i) {
    var d = String(i.direction || '').toLowerCase();
    if (d.indexOf('out') === 0 || i.isDialing === true) return 'OUTBOUND';
    return 'INBOUND';
  }

  function numberOf(i, dir) {
    var list = dir === 'INBOUND'
      ? [i.ani, i.phone, i.displayAddress, i.remoteAddress]
      : [i.phone, i.dnis, i.displayAddress, i.remoteAddress];
    for (var k = 0; k < list.length; k++) { if (list[k]) return normalizeNumber(list[k]); }
    return '';
  }

  function sapEvent(action, id, ani, dir) {
    toSap({
      Type: 'CALL',
      EventType: action === 'END' ? 'UPDATEACTIVITY' : dir,
      Action: action,
      ANI: ani,
      ExternalReferenceID: String(id).replace(/-/g, '')
    });
  }

  // ---------- Genesys-Interaktion -> SAP Notify/Accept/End + Oberflaeche ----------
  function handleInteraction(category, i) {
    if (!i) return;
    var id = i.id || (i.old && i.old.id);
    if (!id) return;
    if (category === 'deallocate') {
      delete calls[id];
      state.interactionId = null;
      setMode('idle', '');
      return;
    }
    if (i.isChat || i.isEmail || i.isMessage || i.isVoicemail || i.isCallback) return;   // nur Telefonie

    state.interactionId = id;
    var c = calls[id] || (calls[id] = {});
    var dir = directionOf(i);
    var ani = numberOf(i, dir);
    var connected = i.isConnected === true || category === 'connect';
    var ended = i.isDisconnected === true || i.isDone === true || category === 'disconnect';

    if (DEBUG && category !== 'change') log('interaction ' + category + ': ' + JSON.stringify(i).slice(0, 700));

    if (!c.notified && !connected && !ended && dir === 'INBOUND') {
      c.notified = true; sapEvent('NOTIFY', id, ani, dir); setMode('ringing', ani);
    }
    if (!c.dialing && !connected && !ended && dir === 'OUTBOUND') {
      c.dialing = true; setMode('dialing', ani);
    }
    if (connected && !c.accepted && !ended) {
      c.accepted = true; sapEvent('ACCEPT', id, ani, dir); setMode('active', ani);
    }
    if (ended && !c.ended) {
      c.ended = true;
      if (c.accepted) { sapEvent('END', id, ani, dir); setMode('acw'); requestSummary(id); }
      else { setMode('idle', ''); }
    }
    updateEmpty();
  }

  // ---------- Nachrichten von SAP (nur Log, z. B. Click-to-Call-Payload) ----------
  function handleSapMessage(e) {
    var d = e.data;
    log('<- SAP ' + (typeof d === 'string' ? d : JSON.stringify(d)).slice(0, 400));
  }

  // ---------- Nachrichten von Genesys (framework.js) ----------
  window.addEventListener('message', function (e) {
    if (inIframe && e.source === window.parent) { handleSapMessage(e); return; }
    if (e.origin !== GENESYS_ORIGIN || e.source !== frame.contentWindow) return;
    var msg;
    try { msg = JSON.parse(e.data); } catch (err) { return; }
    if (!msg || !msg.type) return;
    var d = msg.data || {};

    switch (msg.type) {
      case 'ready':
        state.ready = true;
        log('<- ready');
        if (!interactionFrame.src) { interactionFrame.src = INTERACTION_SRC; log('Interaktionsfenster wird geladen'); }
        renderState(); updateEmpty();
        break;
      case 'interaction':
        handleInteraction(d.category, d.interaction);
        break;
      case 'userAction':
        if (d.category === 'status' && d.data) {
          ui.presence = String(d.data.status || '').toUpperCase();
          log('<- Status: ' + ui.presence);
          renderState();
        } else if (d.category === 'routingStatus') {
          ui.routing = String(typeof d.data === 'string' ? d.data : (d.data && d.data.status) || '').toUpperCase();
          // ACW ist beendet, sobald Genesys wieder IDLE meldet. Nicht auf das spaetere deallocate warten.
          if (ui.mode === 'acw' && ui.routing === 'IDLE') {
            if (state.interactionId) delete calls[state.interactionId];
            state.interactionId = null;
            setMode('idle', '');
          } else {
            renderState();
          }
        } else {
          log('<- userAction ' + JSON.stringify(d).slice(0, 200));
        }
        break;
      case 'summaryResult':
        if (d.conversationId !== pendingSummaryConversationId) break;
        if (d.error) {
          log('Summary-Bridge ERROR: ' + d.error);
          if (summaryPollAttempt < 8) setTimeout(requestSummaryAttempt, 2000);
          break;
        }
        var summaryText = extractSummaryText(d.data);
        if (summaryText) {
          log('SUMMARY GEFUNDEN: ' + summaryText);
          console.log('[CTI Summary Bridge]', { conversationId: d.conversationId, summary: summaryText, raw: d.data });
          pendingSummaryConversationId = null;
          summaryPollAttempt = 0;
        } else if (summaryPollAttempt < 8) {
          log('Summary-Bridge: noch keine Summary, neuer Versuch in 2 s');
          setTimeout(requestSummaryAttempt, 2000);
        } else {
          log('Summary-Bridge: nach 8 Versuchen keine Summary gefunden');
          console.log('[CTI Summary Bridge] Raw response without summary', d.data);
        }
        break;
      case 'contactSearch':
        send('contactSearchResult', { requestId: d.requestId, contacts: [] });
        break;
      case 'processCallLog':
        send('processCallLogResult', { requestId: d.requestId, success: true });
        break;
      case 'error':
        log('<- ERROR ' + d.where + ': ' + d.message);
        break;
      default:
        log('<- ' + msg.type + ' ' + JSON.stringify(d).slice(0, 200));
    }
    updateInfo();
  });

  // ---------- Debug-Buttons ----------
  function needInteraction() {
    if (!state.interactionId) { log('Keine aktive Interaktion'); return false; }
    return true;
  }
  function answerCurrent() { if (needInteraction()) send('answer', { interactionId: state.interactionId }); }
  function hangupCurrent() { if (needInteraction()) send('hangup', { interactionId: state.interactionId }); }
  document.getElementById('btnAnswer').onclick = answerCurrent;
  document.getElementById('btnHangup').onclick = hangupCurrent;
  document.getElementById('btnHeaderAnswer').onclick = answerCurrent;
  document.getElementById('btnHeaderHangup').onclick = hangupCurrent;
  document.getElementById('btnHold').onclick = function () { if (needInteraction()) send('hold', { interactionId: state.interactionId }); };
  document.getElementById('btnMute').onclick = function () { if (needInteraction()) send('mute', { interactionId: state.interactionId }); };

  var fmtSel = document.getElementById('sapFormat');
  fmtSel.value = sapFormat;
  fmtSel.onchange = function () { sapFormat = fmtSel.value; log('SAP-Format: ' + sapFormat); };

  var TEST_ID = 'TEST' + Date.now().toString(16).toUpperCase();
  function testAni() { return normalizeNumber(document.getElementById('sapTestAni').value); }
  document.getElementById('btnSapNotify').onclick = function () { sapEvent('NOTIFY', TEST_ID, testAni(), 'INBOUND'); };
  document.getElementById('btnSapAccept').onclick = function () { sapEvent('ACCEPT', TEST_ID, testAni(), 'INBOUND'); };
  document.getElementById('btnSapEnd').onclick = function () { sapEvent('END', TEST_ID, testAni(), 'INBOUND'); };

  // ---------- Nur-Copilot-Ansicht (Script ausblenden) ----------
  // Das Interaktionsfenster wird virtuell breit (FULL_W) gerendert. Rechts sitzt das Copilot-Panel mit fester Breite
  // (ca. 300 px). Sichtbar ist nur dieser rechte Streifen, vergroessert auf die Breite des SAP-Fensters.
  // URL: ?copilotW=300 (Panelbreite) | ?fullW=1100 | ?maxScale=1.7 | ?script=show (alles zeigen, nur zum Testen)
  var FULL_W = parseInt(params.get('fullW'), 10) || 1100;
  var MAX_SCALE = parseFloat(params.get('maxScale')) || 1.7;
  function ctiLoad(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function ctiStore(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var copilotW = parseInt(params.get('copilotW'), 10) || parseInt(ctiLoad('ctiCopilotW'), 10) || 300;
  var scriptHidden = true;   // Script immer ausgeblendet
  // Feste Breite der Anzeige in px (Standard 340). ?width=400 aendert sie, ?width=0 nutzt die volle Breite des SAP-Fensters.
  var WIDTH = params.has('width') ? (parseInt(params.get('width'), 10) || 0) : 340;
  document.documentElement.style.setProperty('--app-w', WIDTH > 0 ? WIDTH + 'px' : 'none');
  var interEl = document.querySelector('.inter');
  function applyLayout() {
    document.getElementById('cwRange').value = copilotW;
    document.getElementById('cwVal').textContent = copilotW + ' px';
    if (!scriptHidden) { scalebox.style.cssText = ''; interactionFrame.style.cssText = ''; return; }
    var W = interEl.clientWidth, H = interEl.clientHeight;
    if (!W || !H) return;
    var s = Math.min(W / copilotW, MAX_SCALE);
    scalebox.style.cssText = 'position:absolute;right:0;top:0;height:100%;overflow:hidden;width:' + Math.round(copilotW * s) + 'px;';
    interactionFrame.style.cssText = 'position:absolute;right:0;top:0;border:0;width:' + FULL_W + 'px;height:' + Math.round(H / s) +
      'px;transform:scale(' + s + ');transform-origin:top right;';
  }
  document.getElementById('cwRange').oninput = function () {
    copilotW = parseInt(this.value, 10) || 300;
    ctiStore('ctiCopilotW', String(copilotW)); applyLayout();
  };
  window.addEventListener('resize', applyLayout);
  if (window.ResizeObserver) new ResizeObserver(applyLayout).observe(interEl);
  applyLayout();
  log('CTI-Version ' + CTI_VERSION);

  phoneEl.classList.add('collapsed');
  renderState();
  updateEmpty();
  frame.src = FRAME_SRC;
  log('iFrame wird geladen');
})();
</script>
