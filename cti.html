<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesys CTI (SAP Live Interaction Widget)</title>
<style>
  :root {
    --bg: #e9eef4; --card: #ffffff; --text: #1d2d3e; --muted: #6a7a8c; --line: #dde3ea;
    --accent: #0a6fb3; --ok: #19a974; --warn: #f59a32; --danger: #e5484d;
    --rail1: #0d2740; --rail2: #164067;
  }
  body[data-theme="dark"] {
    --bg: #0b1520; --card: #16273a; --text: #e8eef5; --muted: #93a5b8; --line: #2a3e53; --accent: #4aa3df;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { font-family: "72", "Segoe UI", system-ui, -apple-system, Arial, sans-serif; font-size: 13px; background: var(--bg); color: var(--text); }
  .app { position: relative; display: flex; height: 100%; max-width: var(--app-w, none); }

  /* ---- Seitenleiste ---- */
  .rail { flex: 0 0 68px; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0 8px;
          background: #1d232a; color: #fff; z-index: 20; }
  .statusbtn { width: 60px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 9px 3px 8px;
               background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.16); border-radius: 16px; color: #fff; cursor: pointer;
               transition: background .15s, transform .12s; }
  .statusbtn:hover { background: rgba(255,255,255,.18); }
  .statusbtn:active { transform: scale(.97); }
  .ring { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #9aa7b4; flex: none; --pulse: 25,169,116; }
  .dot.ready, .dot.p-green { background: var(--ok); }
  .dot.p-blue { background: #0a6fb3; --pulse: 10,111,179; }
  .dot.p-orange { background: var(--warn); }
  .dot.p-red { background: var(--danger); }
  .dot.p-grey { background: #9aa7b4; }
  .dot.ringing { background: var(--warn); --pulse: 245,154,50; animation: pulse 1s infinite; }
  .dot.active { background: var(--ok); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(var(--pulse), .6); }
    70% { box-shadow: 0 0 0 9px rgba(var(--pulse), 0); }
    100% { box-shadow: 0 0 0 0 rgba(var(--pulse), 0); }
  }
  .slabel { font-size: 10px; line-height: 1.15; font-weight: 600; text-align: center; max-width: 54px; overflow: hidden;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
  .callinfo { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .ctimer { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ctimer:empty, .cnum:empty { display: none; }
  .cnum { max-width: 62px; font-size: 9px; opacity: .75; text-align: center; word-break: break-all; line-height: 1.15; }
  .call-actions { display: none; flex-direction: column; gap: 12px; margin-top: 2px; }
  .call-actions.visible { display: flex; }
  .rbtn { width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center;
          box-shadow: 0 4px 12px rgba(0,0,0,.35); transition: transform .12s, filter .12s; }
  .rbtn:hover { transform: scale(1.08); filter: brightness(1.08); }
  .rbtn svg { width: 22px; height: 22px; fill: currentColor; }
  .rbtn.answer { background: var(--ok); animation: ringpulse 1.2s infinite; }
  .rbtn.hangup { background: var(--danger); }
  .rbtn.hangup svg { transform: rotate(135deg); }
  @keyframes ringpulse { 0%,100% { box-shadow: 0 4px 12px rgba(0,0,0,.35), 0 0 0 0 rgba(25,169,116,.55); } 60% { box-shadow: 0 4px 12px rgba(0,0,0,.35), 0 0 0 10px rgba(25,169,116,0); } }
  .spacer { flex: 1; }
  .tabs { display: flex; flex-direction: column; gap: 8px; }
  .tab { position: relative; width: 56px; padding: 8px 2px 6px; border-radius: 14px; border: 1px solid transparent; background: transparent;
         color: rgba(255,255,255,.72); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;
         font-size: 9px; font-weight: 600; transition: background .15s, color .15s; }
  .tab:hover { background: rgba(255,255,255,.10); color: #fff; }
  .tab svg { width: 22px; height: 22px; fill: currentColor; }
  .tab.on { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.26); color: #fff; }
  .tab.alert::after { content: ''; position: absolute; top: 5px; right: 10px; width: 9px; height: 9px; border-radius: 50%;
                      background: var(--warn); --pulse: 245,154,50; animation: pulse 1s infinite; }
  .tab.dbg { display: none; font-size: 15px; }
  body.debug .tab.dbg { display: flex; }
  .ver { display: flex; flex-direction: column; align-items: center; font-size: 9px; line-height: 1.25; opacity: .65; text-align: center; padding: 0 2px; }
  .ver b { font-size: 10px; }

  /* ---- Hauptbereich: Copilot und Nachbearbeitung nutzen jeweils die volle Hoehe ---- */
  .main { position: relative; flex: 1 1 auto; min-width: 0; margin: 8px; }
  .inter, .acwbox { position: absolute; inset: 0; border-radius: 16px; overflow: hidden; background: var(--card);
                    box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .scalebox { width: 100%; height: 100%; transform-origin: 0 0; }
  .scalebox iframe, .acwbox iframe { width: 100%; height: 100%; border: 0; display: block; }
  .acwbox { z-index: 5; transform: translateX(calc(100% + 16px)); pointer-events: none; transition: transform .32s cubic-bezier(.2,.8,.2,1); }
  .acwbox.open { transform: none; pointer-events: auto; }
  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 8px; text-align: center; padding: 24px; background: var(--card); color: var(--muted);
           pointer-events: none; transition: opacity .25s, visibility .25s; }
  .empty.hidden { opacity: 0; visibility: hidden; }
  .empty svg { width: 56px; height: 56px; fill: var(--accent); opacity: .85; }
  .empty h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--text); }
  .empty p { margin: 0; max-width: 260px; line-height: 1.45; }

  /* ---- Genesys-Anmeldung (Telefon-iFrame nur bei Bedarf sichtbar) ---- */
  .phone { display: none; position: absolute; left: 0; right: 0; top: 0; height: 300px; z-index: 30; border-radius: 16px; overflow: hidden;
           background: var(--card); box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .phone.login { display: block; }
  .phonehead { height: 30px; line-height: 30px; padding: 0 12px; font-weight: 600; font-size: 12px; background: var(--accent); color: #fff; }
  .phone iframe { width: 100%; height: calc(100% - 30px); border: 0; display: block; }

  /* ---- Status-Menue ---- */
  .pop { display: none; position: absolute; left: 76px; top: 10px; width: 232px; max-height: calc(100% - 20px); overflow: auto; z-index: 60;
         background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 6px;
         box-shadow: 0 12px 32px rgba(0,0,0,.35); }
  .pop.open { display: block; }
  .pitem { display: flex; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; color: inherit;
           font: inherit; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .pitem:hover { background: var(--bg); }
  .pitem.on { font-weight: 700; background: var(--bg); }
  .pitem:disabled { opacity: .4; cursor: default; }
  .pgroup { padding: 8px 10px 2px; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }

  /* ---- Debug-Fenster (nur mit ?debug=1, Zahnrad in der Seitenleiste) ---- */
  .debugbar { display: none; position: absolute; left: 0; right: 0; bottom: 0; max-height: 78%; overflow: auto; z-index: 40; padding: 8px;
              background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  body.debug.dbgopen .debugbar { display: block; }
  .row { display: flex; gap: 6px; margin: 4px 0; }
  .row input, .row select { flex: 1; min-width: 0; padding: 4px; }
  .row button { padding: 4px 8px; cursor: pointer; border: 0; border-radius: 4px; background: var(--accent); color: #fff; }
  .row button.ok { background: #00A888; }
  .row button.danger { background: #c0392b; }
  .row button.sap { background: #555; }
  .row .lbl { white-space: nowrap; font-size: 12px; color: var(--muted); align-self: center; }
  .info { font-size: 12px; color: var(--muted); }
  .log { height: 140px; overflow: auto; background: var(--bg); border: 1px solid var(--line); padding: 4px; font-family: monospace; font-size: 11px; white-space: pre-wrap; }

  /* v16 Compact Rail: rail stays fixed; feature panels expand only on demand. */
  .app { width: 68px; max-width: 100%; transition: width .22s ease; overflow: visible; }
  .app.panel-open { width: min(408px, 100%); }
  .app.status-open:not(.panel-open) { width: min(328px, 100%); }
  .main { display: none; flex: 0 0 340px; width: 340px; min-width: 0; margin: 8px; overflow: hidden; }
  .app.panel-open .main { display: block; }
  .inter, .acwbox { display: none; position: absolute; inset: 0; transform: none !important; pointer-events: auto; }
  .main.show-copilot .inter { display: block; }
  .main.show-acw .acwbox { display: block; }
  .main.show-copilot.show-acw { display: flex; flex-direction: column; gap: 8px; }
  .main.show-copilot.show-acw .inter, .main.show-copilot.show-acw .acwbox { display: block; position: relative; inset: auto; min-height: 0; }
  .main.show-copilot.show-acw .inter { flex: 1.25 1 0; }
  .main.show-copilot.show-acw .acwbox { flex: 1 1 0; }
  .scalebox { transform: none !important; width: 100% !important; height: 100% !important; }
  .scalebox iframe, .acwbox iframe { width: 100% !important; height: 100% !important; }

  /* v19 Idle panel: Form2App fills the otherwise unused 340px area. */
  .app.idle-app { width: min(408px, 100%); }
  .app.idle-app .main { display: block; }
  .idleapp { display: none; position: absolute; inset: 0; overflow: hidden; background: #f4f6f8; }
  .app.idle-app .idleapp { display: none; }
  .app.idle-app .idleapp.active { display: block; }
  .idleapp iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .idleapp-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 18px; text-align: center; color: #64748b; font-size: 12px; pointer-events: none; }

  /* v22: utility apps can sit to the right of the conversation panel. */
  .app.with-side-app { width: min(748px, 100%); }
  .sideapps { display:none; flex:0 0 340px; width:340px; min-width:0; margin:8px 8px 8px 0; position:relative; overflow:hidden; border-radius:10px; background:#f4f6f8; }
  .app.with-side-app .sideapps { display:block; }
  .sideapp { display:none; position:absolute; inset:0; background:#fff; }
  .sideapp.active { display:block; }
  .sideapp iframe { width:100%; height:100%; border:0; background:#fff; }
  .idleapp-fallback { display:none !important; }
  .tabs { display:flex; flex-direction:column; }
  .tab.app-tab { order:20; }
  #tabForm2App { margin-top:auto; border-top:1px solid rgba(255,255,255,.16); padding-top:12px; }
  #tabCopilot,#tabAcw { order:5; }
</style>
</head>
<body>

<!-- Provider URL fuer das SAP Live Interaction Widget.
     Optionen: ?composable=1 | ?acw=acw|always|off | ?debug=1 (Zahnrad in der Seitenleiste) | ?theme=dark|light|auto
               ?width=340 (feste Breite, 0 = volle Breite) | ?phone=show (Genesys-Anmeldung zeigen) | ?sap=<format> | ?name=<Komponentenname> -->
<div class="app" id="app">

  <aside class="rail">
    <button type="button" class="statusbtn" id="statusBtn" title="Genesys-Status ändern" aria-haspopup="true">
      <span class="ring"><span class="dot" id="dot"></span></span>
      <span class="slabel" id="stLabel">Nicht verbunden</span>
    </button>
    <select id="statusSelect" hidden aria-label="Genesys-Status">
      <option value="">Nicht verbunden</option>
    </select>
    <span id="stSub" hidden></span>

    <div class="callinfo"><div class="ctimer" id="callTimer"></div><div class="cnum" id="callNum"></div></div>
    <div class="call-actions" id="callActions">
      <button type="button" class="rbtn answer" id="btnHeaderAnswer" title="Anruf annehmen" aria-label="Anruf annehmen"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></button>
      <button type="button" class="rbtn hangup" id="btnHeaderHangup" title="Auflegen" aria-label="Auflegen"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></button>
    </div>

    <div class="spacer"></div>
    <nav class="tabs" id="tabs">
      <button type="button" class="tab on" id="tabCopilot" title="Agent Copilot"><svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg><span>Copilot</span></button>
      <button type="button" class="tab" id="tabAcw" title="Nachbearbeitung"><svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg><span>Nachbearb.</span></button>
    
      <button type="button" class="tab app-tab on" id="tabForm2App" title="Form2App"><svg viewBox="0 0 24 24"><path d="M4 3h16v18H4V3zm2 4v2h12V7H6zm0 4v6h5v-6H6zm7 0v2h5v-2h-5zm0 4v2h5v-2h-5z"/></svg><span>Form2App</span></button>
      <button type="button" class="tab app-tab" id="tabKiwi" title="KiWi"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 3a7 7 0 1 1-7 7 7 7 0 0 1 7-7z"/></svg><span>KiWi</span></button>
</nav>
    <button type="button" class="tab dbg" id="btnDebug" title="Debug-Fenster">&#9881;<span>Debug</span></button>
    <div class="ver" id="ctiVersion"></div>
  </aside>

  <div class="main">
    <section class="idleapp active" id="idleApp">
      <iframe id="form2AppFrame" title="Form2App - Power Apps" src="https://apps.powerapps.com/play/e/ad2dd21e-7cdf-e91f-b7fb-04cb30768246/a/171ba6a1-1b83-4f68-8294-866e3314d311?tenantId=fd738606-95d6-4efd-906c-3373a88a6a6a&hint=ac5f913c-523a-4f7a-a140-3b2ff931d86f&sourcetime=1764139493006&source=portal" allow="clipboard-read; clipboard-write"></iframe>
    </section>
    <section class="idleapp" id="kiwiIdleApp">
      <iframe title="KiWi" src="https://app.sma.ewe-netz.de/" allow="clipboard-read; clipboard-write"></iframe>
    </section>
    <section class="phone" id="phone">
      <div class="phonehead">Bitte bei Genesys anmelden</div>
      <iframe id="genesysFrame"
              allow="camera *; microphone *; geolocation *; clipboard-write *; autoplay *; hid *"
              title="Genesys Cloud Embeddable Framework"></iframe>
    </section>

    <main class="inter">
      <div class="scalebox" id="scalebox">
        <iframe id="genesysInteractionFrame"
                allow="camera *; microphone *; geolocation *; clipboard-write *; autoplay *; hid *"
                title="Genesys Cloud Agent Copilot"></iframe>
      </div>
      <div class="empty" id="empty">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        <h2 id="emptyTitle">Verbinde mit Genesys &hellip;</h2>
        <p id="emptyText">Bitte im Anmeldefenster anmelden.</p>
      </div>
    </main>
  <aside class="sideapps" id="sideApps">
    <section class="sideapp active" id="form2Side"><iframe title="Form2App" src="https://apps.powerapps.com/play/e/ad2dd21e-7cdf-e91f-b7fb-04cb30768246/a/171ba6a1-1b83-4f68-8294-866e3314d311?tenantId=fd738606-95d6-4efd-906c-3373a88a6a6a&hint=ac5f913c-523a-4f7a-a140-3b2ff931d86f&sourcetime=1764139493006&source=portal" allow="clipboard-read; clipboard-write"></iframe></section>
    <section class="sideapp" id="kiwiSide"><iframe title="KiWi" src="https://app.sma.ewe-netz.de/" allow="clipboard-read; clipboard-write"></iframe></section>
  </aside>

    <section class="acwbox" id="acwBox">
      <iframe id="acwFrame" title="Genesys Cloud Nachbearbeitung (ACW)"
              allow="camera *; microphone *; geolocation *; clipboard-write *; autoplay *; hid *"></iframe>
    </section>

  <div class="debugbar">
    <div class="info" id="ctiInfo">Framework: nicht verbunden | Interaktion: -</div>
    <div class="row">
      <button class="ok" id="btnAnswer">Annehmen</button>
      <button class="danger" id="btnHangup">Auflegen</button>
      <button id="btnHold">Halten</button>
      <button id="btnMute">Stumm</button>
    </div>
    <div class="row">
      <span class="lbl">Copilot-Breite</span>
      <input type="range" id="cwRange" min="200" max="600" step="5">
      <span class="lbl" id="cwVal"></span>
    </div>
    <div class="row">
      <select id="sapFormat" title="Nachrichtenformat an SAP">
        <option value="flat-string">flach / JSON-Text</option>
        <option value="flat-object">flach / Objekt</option>
        <option value="wrap-string">payload-Schluessel / JSON-Text</option>
        <option value="wrap-object">payload-Schluessel / Objekt</option>
        <option value="xml">XML (ohne Kopfzeile)</option>
        <option value="xml-decl">XML (mit xml-Kopfzeile)</option>
      </select>
    </div>
    <div class="row">
      <input id="sapTestAni" value="+4915112345678" title="Test-Rufnummer fuer die SAP-Tests">
      <button class="sap" id="btnSapNotify">SAP: Notify</button>
      <button class="sap" id="btnSapAccept">SAP: Accept</button>
      <button class="sap" id="btnSapEnd">SAP: End</button>
    </div>
    <div class="log" id="ctiLog"></div>
  </div>

  </div>

  <div class="pop" id="statusPop" role="menu"></div>
</div>

<script>

  function send(type, data) {

  // ---------- SAP: Events senden ----------
  function xmlOf(p) {
    var x = '<payload>';
    Object.keys(p).forEach(function (k) {
      x += '<' + k + '>' + String(p[k]).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</' + k + '>';
    });
    return x + '</payload>';
  }

  function toSap(payload) {
    if (!SAP_ENABLED || !inIframe) { log('(SAP aus oder Seite nicht in SAP) ' + JSON.stringify(payload)); return; }
    var out;
    if (sapFormat === 'xml' || sapFormat === 'xml-decl') {
      out = (sapFormat === 'xml-decl' ? '<?xml version="1.0" encoding="utf-8"?>' : '') + xmlOf(payload);
    } else {
      out = sapFormat.indexOf('wrap') === 0 ? { payload: payload } : payload;
      if (/string$/.test(sapFormat)) out = JSON.stringify(out);
    }
    window.parent.postMessage(out, '*');
    log('-> SAP [' + sapFormat + '] ' + (typeof out === 'string' ? out : JSON.stringify(out)));
  }

  function normalizeNumber(raw) {
    if (!raw) return '';
    var n = String(raw).replace(/^tel:/i, '').replace(/[\s()\-\/]/g, '');
    if (n.charAt(0) === '+') return n;
    if (n.indexOf('00') === 0) return '+' + n.slice(2);
    if (n.charAt(0) === '0') return DEFAULT_COUNTRY_CODE + n.slice(1);
    return /^\d+$/.test(n) ? '+' + n : n;
  }

  function directionOf(i) {
    var d = String(i.direction || '').toLowerCase();
    if (d.indexOf('out') === 0 || i.isDialing === true) return 'OUTBOUND';
    return 'INBOUND';
  }

  function numberOf(i, dir) {
    var list = dir === 'INBOUND'
      ? [i.ani, i.phone, i.displayAddress, i.remoteAddress]
      : [i.phone, i.dnis, i.displayAddress, i.remoteAddress];
    for (var k = 0; k < list.length; k++) { if (list[k]) return normalizeNumber(list[k]); }
    return '';
  }

  function sapEvent(action, id, ani, dir) {
    toSap({
      Type: 'CALL',
      EventType: action === 'END' ? 'UPDATEACTIVITY' : dir,
      Action: action,
      ANI: ani,
      ExternalReferenceID: String(id).replace(/-/g, '')
    });
  }

  // ---------- Genesys-Interaktion -> SAP Notify/Accept/End + Oberflaeche ----------
  function handleInteraction(category, i) {
    if (!i) return;
    var id = i.id || (i.old && i.old.id);
    if (!id) return;
    if (category === 'deallocate') {
      delete calls[id];
      state.interactionId = null;
      setMode('idle', '');
      return;
    }
    if (i.isChat || i.isEmail || i.isMessage || i.isVoicemail || i.isCallback) return;   // nur Telefonie

    state.interactionId = id;
    if (COMPOSABLE) cdSetInteraction();
    var c = calls[id] || (calls[id] = {});
    var dir = directionOf(i);
    var ani = numberOf(i, dir);
    var connected = i.isConnected === true || category === 'connect';
    var ended = i.isDisconnected === true || i.isDone === true || category === 'disconnect';

    if (DEBUG && category !== 'change') log('interaction ' + category + ': ' + JSON.stringify(i).slice(0, 700));

    if (!c.notified && !connected && !ended && dir === 'INBOUND') {
      c.notified = true; sapEvent('NOTIFY', id, ani, dir); setMode('ringing', ani);
    }
    if (!c.dialing && !connected && !ended && dir === 'OUTBOUND') {
      c.dialing = true; setMode('dialing', ani);
    }
    if (connected && !c.accepted && !ended) {
      c.accepted = true; sapEvent('ACCEPT', id, ani, dir); setMode('active', ani);
    }
    if (ended && !c.ended) {
      c.ended = true;
      if (c.accepted) { sapEvent('END', id, ani, dir); setMode('acw'); }
      else { setMode('idle', ''); }
    }
    updateEmpty();
  }

  // ---------- Nachrichten von SAP (nur Log, z. B. Click-to-Call-Payload) ----------
  function handleSapMessage(e) {
    var d = e.data;
    log('<- SAP ' + (typeof d === 'string' ? d : JSON.stringify(d)).slice(0, 400));
  }

  // ---------- Nachrichten von Genesys (framework.js) ----------
  window.addEventListener('message', function (e) {
    if (inIframe && e.source === window.parent) { handleSapMessage(e); return; }
    if (e.origin !== GENESYS_ORIGIN || e.source !== frame.contentWindow) return;
    var msg;
    try { msg = JSON.parse(e.data); } catch (err) { return; }
    if (!msg || !msg.type) return;
    var d = msg.data || {};

    switch (msg.type) {
      case 'ready':
        state.ready = true;
        log('<- ready');
        phoneEl.classList.remove('login');
        if (!interactionFrame.src && !COMPOSABLE) { interactionFrame.src = INTERACTION_SRC; log('Interaktionsfenster wird geladen'); }
        renderState(); updateEmpty();
        break;
      case 'interaction':
        handleInteraction(d.category, d.interaction);
        break;
      case 'userAction':
        if (d.category === 'status' && d.data) {
          ui.presence = String(d.data.status || '').toUpperCase();
          log('<- Status: ' + ui.presence);
          renderState();
        } else if (d.category === 'routingStatus') {
          ui.routing = String(typeof d.data === 'string' ? d.data : (d.data && d.data.status) || '').toUpperCase();
          // ACW ist beendet, sobald Genesys wieder IDLE meldet. Nicht auf das spaetere deallocate warten.
          if (ui.mode === 'acw' && ui.routing === 'IDLE') {
            if (state.interactionId) delete calls[state.interactionId];
            state.interactionId = null;
            setMode('idle', '');
          } else {
            renderState();
          }
        } else {
          log('<- userAction ' + JSON.stringify(d).slice(0, 200));
        }
        break;
      case 'contactSearch':
        send('contactSearchResult', { requestId: d.requestId, contacts: [] });
        break;
      case 'processCallLog':
        send('processCallLogResult', { requestId: d.requestId, success: true });
        break;
      case 'error':
        log('<- ERROR ' + d.where + ': ' + d.message);
        break;
      default:
        log('<- ' + msg.type + ' ' + JSON.stringify(d).slice(0, 200));
    }
    updateInfo();
  });

    var app = document.getElementById('app');

    if (hasConversation && !lastHadConversation) copilotOpen = true;
    if (hasConversation && ui.mode === 'acw') acwOpen = true;

  function cdPost(type, data) {
    if (!cdBroker || !cdBroker.contentWindow) return;
    cdBroker.contentWindow.postMessage({ type: 'Genesys.ComposableDesktop.' + type, data: data }, '*');
    log('-> CD ' + type + ' ' + JSON.stringify(data));

  function cdSetInteraction(force) {
    if (!cdRegistered || !cdAuth || !state.interactionId) return;
    var iid = state.interactionId;
    if (!force && cdSent === iid) return;
    cdSent = iid;
    cdPost('SET_INTERACTION', { componentId: CD_ID, scope: 'default', interactionId: iid });
    if (ACW_MODE !== 'off') cdPost('SET_INTERACTION', { componentId: CD_ID, scope: 'embedded', id: ACW_ID, interactionId: iid });

    clearTimeout(cdSetTimer);
    cdSetTimer = setTimeout(function () {
      if (cdRegistered && cdAuth && state.interactionId === iid) {
        cdPost('SET_INTERACTION', { componentId: CD_ID, scope: 'default', interactionId: iid });
        if (ACW_MODE !== 'off') cdPost('SET_INTERACTION', { componentId: CD_ID, scope: 'embedded', id: ACW_ID, interactionId: iid });
      }
    }, 600);
  }
  function cdShowBroker(show) { if (cdBroker) cdBroker.style.display = show ? 'block' : 'none'; }
  function cdHandle(e) {
    if (!cdBroker || e.source !== cdBroker.contentWindow) return;
    var m = e.data;
    try { if (typeof m === 'string') m = JSON.parse(m); } catch (err) { return; }
    if (!m || !m.type || String(m.type).indexOf('Genesys.ComposableDesktop.') !== 0) return;
    var d = m.data || {}, t = String(m.type).replace('Genesys.ComposableDesktop.', '');
    log('<- CD ' + t + ' ' + JSON.stringify(d).slice(0, 240));
    if (t === 'REGISTRATION_RESPONSE') {
      cdRegistered = true;
      cdPost('GET_STATUS', { componentId: CD_ID, contextId: 'after-register' });
    } else if (t === 'STATUS_UPDATE') {
      if (d.contextId === 'handshake' || d.contextId === 'initial') {
        if (!cdRegSent) { cdRegSent = true; cdPost('REGISTRATION_REQUEST', { componentId: CD_ID, name: CD_NAME }); }
        return;
      }
      cdAuth = d.authenticated === true;
      cdShowBroker(!cdAuth || params.get('brokerUi') === '1');
      if (cdAuth) cdSetInteraction(true);
    }
  }
  function cdStart() {
    window.addEventListener('message', cdHandle);
    cdBroker = document.createElement('iframe');
    cdBroker.id = 'cdBroker';
    cdBroker.title = 'Genesys Composable Desktop Broker';
    cdBroker.style.cssText = 'display:none;position:fixed;left:0;bottom:0;width:100%;height:64px;border:0;z-index:9998;background:#fff;';
    cdBroker.onload = function () { cdPost('GET_STATUS', { componentId: CD_ID, contextId: 'handshake' }); };
    cdBroker.src = CD_BASE + 'index.html?show-broker-ui=true&mini-display-type=true';
    document.body.appendChild(cdBroker);
    interactionFrame.src = CD_BASE + 'component.html#/copilot?size=' + encodeURIComponent(CD_SIZE) + '&scope=default';
    if (ACW_MODE !== 'off') document.getElementById('acwFrame').src = CD_BASE + 'component.html#/acw?size=' + encodeURIComponent(CD_SIZE) + '&scope=embedded&scopeId=' + ACW_ID;
    log('Composable Desktop: Komponente ' + CD_ID + ' (' + CD_NAME + ')');
    setTimeout(function () { if (!cdAuth) cdShowBroker(true); }, 6000);   // Anmeldung im Broker anzeigen, falls noetig
  }

  var scriptHidden = params.get('script') !== 'show' && !COMPOSABLE;   // Standard: Script ausgeblendet; zum Testen ?script=show
  // Feste Breite der Anzeige in px (Standard 340). ?width=400 aendert sie, ?width=0 nutzt die volle Breite des SAP-Fensters.
  var WIDTH = params.has('width') ? (parseInt(params.get('width'), 10) || 0) : 340;
  document.documentElement.style.setProperty('--app-w', WIDTH > 0 ? WIDTH + 'px' : 'none');
  var interEl = document.querySelector('.inter');
  function applyLayout() {
    document.getElementById('cwRange').value = copilotW;
    document.getElementById('cwVal').textContent = copilotW + ' px';
    if (!scriptHidden) { scalebox.style.cssText = ''; interactionFrame.style.cssText = ''; return; }
    var W = interEl.clientWidth, H = interEl.clientHeight;
    if (!W || !H) return;
    var s = Math.min(W / copilotW, MAX_SCALE);
    scalebox.style.cssText = 'position:absolute;right:0;top:0;height:100%;overflow:hidden;width:' + Math.round(copilotW * s) + 'px;';
    interactionFrame.style.cssText = 'position:absolute;right:0;top:0;border:0;width:' + FULL_W + 'px;height:' + Math.round(H / s) +
      'px;transform:scale(' + s + ');transform-origin:top right;';
  }
  document.getElementById('cwRange').oninput = function () {
    copilotW = parseInt(this.value, 10) || 300;
    ctiStore('ctiCopilotW', String(copilotW)); applyLayout();
  };
  window.addEventListener('resize', applyLayout);
  if (window.ResizeObserver) new ResizeObserver(applyLayout).observe(interEl);
  applyLayout();
  log('CTI-Version ' + CTI_VERSION);

  phoneEl.classList.add('collapsed');
  renderState();
  updateEmpty();
  // ---------- Seitenleiste: Status-Menue, Tabs, Debug, Version, Anmeldung ----------
  var statusPop = document.getElementById('statusPop');
  function closeStatusPop() { statusPop.classList.remove('open'); document.getElementById('app').classList.remove('status-open'); }
  function renderStatusPop() {
    var sel = document.getElementById('statusSelect');
    statusPop.innerHTML = '';
    function item(opt) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pitem' + (opt.value === ui.presence ? ' on' : '');
      b.disabled = !!opt.disabled;
      b.textContent = opt.textContent;
      b.onclick = function () {
        sel.value = opt.value;
        sel.dispatchEvent(new Event('change'));
        closeStatusPop();
      };
      return b;
    }
    Array.prototype.forEach.call(sel.children, function (ch) {
      if (ch.tagName === 'OPTGROUP') {
        var h = document.createElement('div');
        h.className = 'pgroup';
        h.textContent = ch.label;
        statusPop.appendChild(h);
        Array.prototype.forEach.call(ch.children, function (o) { statusPop.appendChild(item(o)); });
      } else if (ch.value) {
        statusPop.appendChild(item(ch));
      }
    });
  }
  document.getElementById('statusBtn').onclick = function (e) {
    e.stopPropagation();
    if (statusPop.classList.contains('open')) { closeStatusPop(); return; }
    renderStatusPop();
    statusPop.classList.add('open');
    document.getElementById('app').classList.add('status-open');
  };
  document.addEventListener('click', function (e) { if (!statusPop.contains(e.target)) closeStatusPop(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeStatusPop(); });

  document.getElementById('tabForm2App').onclick = function () { selectUtilityApp('form2app'); };
  document.getElementById('tabKiwi').onclick = function () { selectUtilityApp('kiwi'); };
  document.getElementById('tabCopilot').onclick = function () { if (state.interactionId && ui.mode !== 'idle') copilotOpen = !copilotOpen; updateAcwBox(); };
  document.getElementById('tabAcw').onclick = function () { if (state.interactionId && ui.mode !== 'idle') acwOpen = !acwOpen; updateAcwBox(); };
  if (!COMPOSABLE || ACW_MODE === 'off') document.getElementById('tabs').style.display = 'none';
  document.getElementById('btnDebug').onclick = function () { document.body.classList.toggle('dbgopen'); };

  var verEl = document.getElementById('ctiVersion');
  var verParts = CTI_VERSION.split(' \u00b7 ');
  var verB = document.createElement('b'); verB.textContent = verParts[1] || CTI_VERSION;
  var verS = document.createElement('span'); verS.textContent = verParts[0] || '';
  verEl.appendChild(verB); verEl.appendChild(verS);
  verEl.title = 'CTI-Version: ' + CTI_VERSION;

  // Genesys-Anmeldung: Das Telefon-iFrame bleibt unsichtbar, erscheint aber als Overlay, wenn noch keine Verbindung steht.
  if (params.get('phone') === 'show') phoneEl.classList.add('login');
  setTimeout(function () { if (!state.ready) phoneEl.classList.add('login'); }, 4000);

  if (COMPOSABLE) cdStart();
  frame.src = FRAME_SRC;
  log('iFrame wird geladen');
})();
</script>
</body>
</html>
